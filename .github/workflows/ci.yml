name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Swift build & test
        run: |
          swift build
          swift test
      - name: Package app
        run: bash Scripts/build_app.sh

  rust-core:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test (host)
        working-directory: core-rust
        run: cargo test
      - name: Check Windows target
        working-directory: core-rust
        if: matrix.os != 'windows-latest'
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Build Windows exe
        working-directory: core-rust
        if: matrix.os == 'windows-latest'
        run: cargo build --release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [swift-macos, rust-core]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & package
        run: bash Scripts/build_app.sh
      - name: Zip app
        run: cd build && zip -r ShortKey-${{ github.ref_name }}.zip ShortKey.app
      - uses: softprops/action-gh-release@v2
        with:
          files: build/ShortKey-*.zip
